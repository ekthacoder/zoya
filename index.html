<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>For Zoya 💖</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #ffdde1, #ee9ca7);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: #5a2a2a;
    }

    .container {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 32px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      position: relative;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      background: #ff4d6d;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(255, 77, 109, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 25px rgba(255, 77, 109, 0.6);
    }

    .message {
      display: none;
      margin-top: 20px;
      font-size: 1.05rem;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      width: 18px;
      height: 18px;
      animation: float 6s infinite ease-in;
      opacity: 0.6;
    }

    @keyframes float {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      20% {
        opacity: 0.8;
      }
      100% {
        transform: translateY(-600px) scale(1.4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- SVG Heart Template -->
  <svg width="0" height="0">
    <defs>
      <symbol id="svg-heart" viewBox="0 0 32 29.6">
        <path
          fill="#ff4d6d"
          d="M23.6,0c-3.4,0-6.4,2-7.6,4.9C14.8,2,11.8,0,8.4,0
          C3.8,0,0,3.8,0,8.4c0,9.4,16,21.2,16,21.2s16-11.8,16-21.2
          C32,3.8,28.2,0,23.6,0z"/>
      </symbol>
    </defs>
  </svg>

  <div class="container">
    <h1>Happy Valentine’s Day 💕</h1>
    <p>
      Zoya, even miles apart,<br>
      my heart somehow always finds yours.
    </p>

    <button onclick="showMessage()">Tap Me 💖</button>

    <div class="message" id="message">
      🌸 You are my calm in chaos,<br>
      my smile on hard days,<br>
      and my favorite feeling.  
      <br><br>
      Today is special because **you exist** 💫
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById("message").style.display = "block";
    }

    // Create floating hearts
    for (let i = 0; i < 20; i++) {
      const heart = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      heart.classList.add("heart");
      heart.setAttribute("viewBox", "0 0 32 29.6");
      heart.innerHTML = '<use href="#svg-heart"></use>';
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.bottom = "-20px";
      heart.style.animationDelay = Math.random() * 5 + "s";
      heart.style.animationDuration = 5 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
    }
  </script>

</body>
</html>
